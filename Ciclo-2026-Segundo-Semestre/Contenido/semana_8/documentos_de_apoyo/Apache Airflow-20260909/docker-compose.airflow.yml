name: ss2-semana8-airflow

x-airflow-common: &airflow-common
  image: ss2-airflow-semana8:3.1.1
  build: .
  restart: unless-stopped
  env_file:
    - .env # Carga AIRFLOW_UID
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CELERY__WORKER_CONCURRENCY: "2"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "15"
    DBT_HOST: warehouse
    DBT_USER: sgfood
    DBT_PASSWORD: "${WAREHOUSE_PASSWORD}"
    DBT_DATABASE: sgfood_dw
    AIRFLOW_CONN_WAREHOUSE_SGFOOD: '${AIRFLOW_CONN_WAREHOUSE_SGFOOD}'
    # --- USUARIOS Y ACCESOS ---
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin,bi:user,analyst:viewer"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/auth/simple_auth_passwords.json"
    # acceso correcto al API-server desde todos los contenedoress
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    # --- claves compartidas ---
    AIRFLOW__API_AUTH__JWT_SECRET: "${JWT_SECRET}"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${SECRET_KEY}" #variable de entorno, ubicadas en .env
    AIRFLOW__API__SECRET_KEY: "${SECRET_KEY}" # variable de entorno, ubicadas en .env
    AIRFLOW__CORE__FERNET_KEY: "${FERNET_KEY}" # variable de entorno, ubicadas en .env
    # (opcional) expón la raíz por si más adelante cambias prefijo o puerto
    AIRFLOW__API__BASE_URL: "http://airflow-api-server:8080"
    AIRFLOW__API__EXPOSE_CONFIG: "True" # solo para dev si quieres ver la config en la UI

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./auth:/opt/airflow/auth
    - ./dbt:/opt/airflow/dbt
    - ./dbt_config:/opt/airflow/dbt_config:ro
    - ./scripts:/opt/airflow/lab_scripts:ro
  user: "${AIRFLOW_UID}:0"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    warehouse:
      condition: service_healthy
  networks: [airflow-net]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
    networks: [airflow-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    networks: [airflow-net]

  warehouse:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sgfood
      POSTGRES_PASSWORD: "${WAREHOUSE_PASSWORD}"
      POSTGRES_DB: sgfood_dw
    volumes:
      - warehouse-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgfood -d sgfood_dw"]
      interval: 10s
      retries: 5
    networks: [airflow-net]

  airflow-init:
    <<: *airflow-common
    restart: "no"
    command: airflow db migrate
    #profiles: ["init"]

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8083:8080" # interfaz local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

    # ⬇  Servicio adicional en 3.x
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8974/health"]
      interval: 15s
      retries: 10

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    depends_on:
      airflow-api-server:
        condition: service_healthy

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-cli:
    <<: *airflow-common
    restart: "no"
    entrypoint: ["airflow"]
    profiles: ["cli"]

volumes:
  postgres-db-volume:
  warehouse-db-volume:

networks:
  airflow-net:
