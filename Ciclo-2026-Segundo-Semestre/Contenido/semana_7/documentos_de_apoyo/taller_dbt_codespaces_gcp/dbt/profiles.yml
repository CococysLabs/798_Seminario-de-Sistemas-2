ss2_sgfood_workshop:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('DBT_DATASET_PREFIX') }}"
      threads: 4
      keyfile: "{{ env_var('SS2_WORKSHOP_FILE') }}"
      location: "{{ env_var('GCP_BIGQUERY_LOCATION', 'US') }}"
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 1
