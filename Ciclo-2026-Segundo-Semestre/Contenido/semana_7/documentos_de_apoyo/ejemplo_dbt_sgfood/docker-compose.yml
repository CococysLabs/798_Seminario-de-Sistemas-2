services:
  postgres:
    image: postgres:16
    container_name: semana7-dbt-sgfood-postgres
    environment:
      POSTGRES_DB: sgfood_dw
      POSTGRES_USER: sgfood_user
      POSTGRES_PASSWORD: sgfood_pass
      TZ: America/Guatemala
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgfood_user -d sgfood_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

